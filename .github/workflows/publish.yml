name: Publish

# The bundle commit pushed by CI after each merge carries [skip ci], so a tag
# on it does not trigger this workflow: run it by hand on the tag
# (Actions → Publish → Run workflow → tag vX.Y.Z).
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build package
        run: python -m build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Install package from wheel
        run: |
          pip install dist/*.whl

      - name: Test import
        run: |
          python -c "from genro_tytx import to_tytx, from_tytx; print('Import OK')"

  publish:
    runs-on: ubuntu-latest
    needs: test
    environment: release
    permissions:
      id-token: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  npm:
    # Trusted publishing (OIDC): configured on npmjs.com for genro-org/genro-tytx,
    # publish.yml, environment release. Skips a version already on npm.
    runs-on: ubuntu-latest
    needs: test
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: npm 11.5.1 or later for trusted publishing
        run: npm install -g npm@latest

      - name: Publish @genrojs/tytx
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@genrojs/tytx@$VERSION" version >/dev/null 2>&1; then
            echo "@genrojs/tytx@$VERSION is already on npm"
          else
            npm publish --access public
          fi

  jsr:
    # Tokenless OIDC: the JSR package @genro/tytx is linked to genro-org/genro-tytx.
    # Skips a version already on JSR.
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install the npm dependencies the JSR publisher resolves
        run: npm install --no-package-lock --ignore-scripts --no-audit --no-fund

      - name: Publish @genro/tytx
        run: |
          VERSION=$(node -p "require('./jsr.json').version")
          if curl -fsS https://jsr.io/@genro/tytx/meta.json | node -e "process.exit(JSON.parse(require('fs').readFileSync(0)).versions['$VERSION'] ? 0 : 1)"; then
            echo "@genro/tytx@$VERSION is already on JSR"
          else
            npx jsr publish
          fi
